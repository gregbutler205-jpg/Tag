services:
  - type: web
    name: tag
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build && cd server && npm install
    startCommand: cd server && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: FIREWORKS_API_KEY
        sync: false
      - key: FIREWORKS_MODEL
        value: accounts/fireworks/models/deepseek-v4-flash
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLOUD_VISION_KEY
        sync: false
      - key: FIRST_PASS_MODEL
        value: gpt-5.4-mini
      - key: ESCALATION_MODEL
        value: gpt-5.4
      - key: CONFIDENCE_THRESHOLD
        value: "0.85"
      - key: FIRST_PASS_DETAIL
        value: high
      - key: ESCALATION_DETAIL
        value: high
      - key: ESCALATION_REASONING_EFFORT
        value: low
      - key: ESCALATION_USE_REASONING
        value: "false"
